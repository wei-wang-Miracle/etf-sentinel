services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etf_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-etf_sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请复制 .env.example 为 .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    volumes:
      - ./api/config:/app/config:ro
    environment:
      CHATBI_TOKEN: ${CHATBI_TOKEN:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-etf_sentinel}
      PGUSER: ${POSTGRES_USER:-etf_sentinel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请复制 .env.example 为 .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
